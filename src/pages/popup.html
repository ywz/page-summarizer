<!doctype html>
<html>

<head>
  <title>Page Summarizer</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    /* Some existing styles remain in the head for now */
    body {
      min-width: 320px;
      margin: 0;
      padding: 0;
      position: relative;
      z-index: 1;
      font-size: 0.9rem;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }


  </style>
</head>

<body>
  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <!-- <span>Page Summarizer</span> -->
       <span>
      <select id="profileContainer" name="profile" class="model-select">
      </select>
       </span>
    </div>

    <div class="header-buttons">
      <button id="newWindow" class="header-button" title="Open in new window">
        <img src="../assets/icons/external-link.svg" width="15" height="15" alt="Open in new window">
      </button>
      <button id="copySummary" class="header-button" title="Copy summary">
        <img src="../assets/icons/clipboard.svg" width="15" height="15" alt="Copy summary">
      </button>
      <button id="options" class="header-button" title="Settings">
        <img src="../assets/icons/gear.svg" width="15" height="15" alt="Settings">
      </button>
      <button id="close" class="header-button" title="Close">
        <img src="../assets/icons/x-lg.svg" width="15" height="15" alt="Close">
      </button>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <!-- Profile Section -->
    <!-- <div class="profileContainer"> -->
      <!-- <span class="section-label">Profile</span> -->
      <!-- <select id="profileContainer" name="profile" class="model-select"> -->
      <!-- </select> -->
    <!-- </div> -->

    <!-- Model Section (Hidden) -->
    <div class="hidden">
      <span class="section-label">
        Model
      </span>
      <select id="model" name="model" class="model-select">
      </select>
    </div>

    <!-- Input Section -->
    <div class="input-container">
      <input id="instructions" class="input-field" placeholder="Enter instructions...">
      <div class="input-icon">
        <img src="../assets/icons/text-file.svg" class="h-4 w-4" alt="Instructions">
      </div>
      <button id="summarize" class="send-button" title="Summarize page">
        <span>Send</span>
      </button>
    </div>

    <!-- Error Messages -->
    <div id="errors" class="errors fade-in"></div>

    <!-- Summary Card -->
    <div id="summaryCard" class="hidden fade-in">
      <div class="summary-card">
        <div id="summary" class="summary-content"></div>
      </div>
    </div>

    <div id="debug" class="debug"></div>
  </div>

  <script src="../../assets/marked.min.js"></script>
  <script type="module" src="../../assets/pdf.min.mjs"></script>
  <script type="module" src="../../assets/pdf.worker.min.mjs"></script>
  <script src="popup.js"></script>
</body>

</html>
